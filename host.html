else{firebase.initializeApp(FB);db=firebase.database();firebase.auth().signInAnonymously().then(u=>{uid=u.user.uid;
 watch(ROOM)}).catch(e=>fail('Кіру қатесі: '+e.message+'. Authentication → Anonymous қосылғанын тексеріңіз.'))}
function home(){R=null;app.innerHTML=`<h1>ҰЙЫМДАСТЫРУШЫ 🎮</h1><div class="card" style="text-align:center">Мысықты үйіне жеткіз · басқару беті. Бөлмені ашқаннан кейін оқушыларға <b>index.html</b> сілтемесін жіберіңіз.</div>
<button class="btn" onclick="mk()">🎮 ОЙЫН БӨЛМЕСІН ҚҰРУ</button><div class="sm" style="text-align:center">${msg}</div>`}
async function mk(){const t={};TEAMS.forEach((_,i)=>t[i]={s:0,p:0,c:0,w:0,r:false});
 try{await db.ref('rooms/'+ROOM).set({host:uid,state:'lobby',teams:t});watch(ROOM)}catch(e){msg='Бөлме басқа ұйымдастырушыға тиесілі';home()}}
function watch(c){if(ref)ref.off();ref=db.ref('rooms/'+c);code=c;ref.on('value',s=>{prev=R;R=s.val();if(!R){return home()}localStorage.cgOn=1;if(R.state==='lobby')shown=null;if(R.state!=='finished')final.d=0;
 if(prev&&prev.teams)TEAMS.forEach((t,i)=>{if(!prev.teams[i].r&&R.teams[i].r){toast(t.n+': МЕН ҮЙІМЕ ЖЕТТІМ! 🏡🐱');fx(0)}});
 if(prev&&prev.state!=='finished'&&R.state==='finished')fx(1);render();if(R.host===uid)hostProc()},e=>fail('Деректер базасына рұқсат жоқ: '+e.message+'. Rules жарияланғанын тексеріңіз.'))}
const lanes=()=>TEAMS.map((t,i)=>{const T=R.teams[i],me=R.players?.[uid]?.t===i;return `<div class="lane ${me?'me':''}" style="--c:${t.c};--p:${T.p}"><b>${t.n}</b><div class="trk"><svg class="cat ${T.p>=20?'home':''}"><use href="#cat"/></svg><svg class="hs"><use href="#house"/></svg></div><span>${T.p}/20</span></div>`}).join('');
const chips=()=>`<div class="chips">${TEAMS.map((t,i)=>`<div class="chip" style="--c:${t.c}"><span>${t.n}</span><span>${R.teams[i].s} ұпай</span></div>`).join('')}</div>`;
const plist=()=>Object.entries(R.players||{}).sort((a,b)=>a[1].t-b[1].t).map(([u,p])=>`<div class="pl"><span style="color:#000a">●</span><span>${TEAMS[p.t].n} · ${p.n}</span>${R.host===uid&&R.state==='lobby'?`<button onclick="rel('${u}')">✕</button>`:`<span class=sm>${R.pts?.[u]||0}</span>`}</div>`).join('')||'<div class=sm>Әзірге ешкім жоқ</div>';
function rel(u){const p=R.players[u];ref.update({['players/'+u]:null,['slots/'+p.t+'_'+p.i]:null})}
function render(){if(!R)return;if(R.host!==uid)return app.innerHTML='<div class="big r">Бөлме басқа ұйымдастырушы құрылғысына тиесілі. Ойынды бастаған браузерді пайдаланыңыз.</div>';if(R.state==='finished')return final();
 if(R.host===uid)return R.state==='lobby'?lobbyH():boardH();
 if(!R.players?.[uid])return joinSel();R.state==='lobby'?waitP():quiz()}
function lobbyH(){app.innerHTML=`<h2>Бөлме ашық ✅</h2><div class="card" style="text-align:center">Оқушылар осы бет сілтемесін ашып, «ОЙЫНҒА ҚОСЫЛУ» батырмасын басады.<div class=sm>${location.href.replace(/host\.html.*$/,'index.html')}</div></div>
<div class="card"><b>Қосылғандар: ${Object.keys(R.players||{}).length}</b>${plist()}</div><button class="btn" onclick="ref.child('state').set('playing')" ${R.players?'':'disabled'}>▶ ОЙЫНДЫ БАСТАУ</button>`}
function boardH(){const ex=Object.entries(R.players||{}).filter(([u,p])=>Object.keys(R.results?.[u]||{}).length>=Q.length).map(([u,p])=>p.n);
 app.innerHTML=`<h2>Ойын барысы</h2>${chips()}<div class="card">${lanes()}</div>${ex.length?`<div class="warn">⚠️ Сұрақтар таусылды: ${ex.join(', ')}. Жаңа сұрақ ойдан шығарылмайды.</div>`:''}<div class="card">${plist()}</div>
<button class="btn" style="--c:#ff9a9a" onclick="if(confirm('Ойынды аяқтау керек пе?'))ref.child('state').set('finished')">🏁 ОЙЫНДЫ АЯҚТАУ</button>`}
function joinSel(){const t=J.t;app.innerHTML=`<h2>Тобыңды таңда</h2>${TEAMS.map((x,i)=>`<button class="btn ${t===i?'sel':''}" style="--c:${x.c}" onclick="J={t:${i},i:null};render()">${x.n}</button>`).join('')}
${t!==null?`<h2>Атыңды таңда</h2>${TEAMS[t].m.map((n,i)=>{const o=R.slots?.[t+'_'+i];return `<button class="btn ${J.i===i?'sel':''}" style="--c:#fff" ${o?'disabled':''} onclick="J.i=${i};render()">${n}${o?' (бос емес)':''}</button>`}).join('')}`:''}<div class="sm" style="text-align:center">${msg}</div>
<button class="btn" ${J.i===null?'disabled':''} onclick="join()">ОЙЫНҒА ҚОСЫЛУ</button><button class="btn" style="--c:#eee" onclick="home()">← Артқа</button>`}
async function join(){const{t,i}=J,o=[...Q.keys()].map(k=>k+1).sort(()=>Math.random()-.5);
 try{await ref.child('slots/'+t+'_'+i).set(uid);await ref.child('players/'+uid).set({n:TEAMS[t].m[i],t,i,o});msg=''}catch(e){msg='Бұл есім бос емес немесе құрылғы бұрын тіркелген';render()}}
function head(){const p=R.players[uid],T=TEAMS[p.t];return `<div class="card" style="--c:${T.c}"><div style="display:flex;align-items:center;gap:8px"><svg width=54 height=54 style="--c:${T.c}"><use href="#cat"/></svg><div><b>${p.n}</b><br><span class=sm>${T.n} · жеке: ${R.pts?.[uid]||0} · топ: ${R.teams[p.t].s}</span></div></div></div>${chips()}<div class="card">${lanes()}</div>`}
function waitP(){app.innerHTML=`${head()}<div class="big" style="background:#fff0c9">Ұйымдастырушы ойынды бастағанша күтіңіз… 🧶</div>`}
function quiz(){const p=R.players[uid],res=R.results?.[uid]||{},o=p.o,cnt=Object.keys(res).length;
 if(shown===null)shown={n:cnt,until:0};if(cnt>shown.n){shown={n:cnt,until:Date.now()+1700,ok:res[o[cnt-1]].ok};setTimeout(render,1750)}
 let body;if(Date.now()<shown.until)body=shown.ok?'<div class="big g">ДҰРЫС ЖАУАП! Жарайсың!</div>':'<div class="big r">ҚАТЕ ЖАУАП! Тағы да байқап көр!</div>';
 else if(cnt>=o.length)body='<div class="big" style="background:#ffe08a">Сұрақтарың таусылды! Ұйымдастырушыға хабарланды.</div>';
 else{const q=o[cnt],d=Q[q-1],a=R.answers?.[uid]?.[q];body=`<div class="card"><div class=sm>Сұрақ ${cnt+1}</div><div class="q">${d.q}</div>${d.o.map((t,k)=>`<button class="btn ${a===k?'sel':''}" style="--c:#fff" ${a!==undefined?'disabled':''} onclick="ans(${q},${k})">${L[k]}) ${t}</button>`).join('')}${a!==undefined?'<div class=sm>Тексерілуде…</div>':''}</div>`}
 app.innerHTML=head()+body}
function ans(q,k){ref.child('answers/'+uid+'/'+q).set(k).catch(()=>{});$('#app').querySelectorAll('.card .btn').forEach(b=>b.disabled=true)}
// Ұйымдастырушы құрылғысы — төреші: жауапты кілтпен тексеріп, нәтижені бір атомдық жазумен сақтайды
function hostProc(){if(R.state!=='playing')return;const A=R.answers||{};R.results=R.results||{};R.pts=R.pts||{};
 for(const u in A){const P=R.players?.[u];if(!P)continue;const cnt=Object.keys(R.results[u]||{}).length,q=P.o[cnt],k=q&&A[u][q],key=u+'_'+q;
  if(q===undefined||k===undefined||busy[key])continue;busy[key]=1;const ok=Q[q-1].a===k,T=R.teams[P.t],np=Math.max(0,Math.min(20,T.p+(ok?1:-1))),
  n={s:T.s+(ok?10:0),p:np,c:T.c+(ok?1:0),w:T.w+(ok?0:1),r:T.r||np>=20},pt=(R.pts[u]||0)+(ok?10:0);
  (R.results[u]=R.results[u]||{})[q]={ok};R.teams[P.t]=n;R.pts[u]=pt;
  ref.update({['results/'+u+'/'+q]:{ok},['teams/'+P.t]:n,['pts/'+u]:pt}).catch(()=>{}).finally(()=>delete busy[key])}
 const ps=Object.keys(R.players||{});if(ps.length&&ps.every(u=>Object.keys(R.results[u]||{}).length>=Q.length))ref.child('state').set('finished')}
function final(){const r=TEAMS.map((t,i)=>({...R.teams[i],i,t})).sort((a,b)=>b.s-a.s),top=r.filter(x=>x.s===r[0].s);
 const w=top.length>1?`🤝 ТЕҢ НӘТИЖЕ: ${top.map(x=>x.t.n).join(', ')} (${r[0].s} ұпай)`:`🏆 ЖЕҢІМПАЗ — ${top[0].t.n.toUpperCase()}!`;
 app.innerHTML=`<div class="big" style="font-size:26px;background:#ffe08a">${w}</div><div style="text-align:center">${top.map(x=>`<svg width=90 height=90 style="--c:${x.t.c}"><use href="#cat"/></svg><svg width=90 height=90 style="--c:${x.t.c}"><use href="#house"/></svg>`).join('')}</div>
 <div class="card"><table><tr><th></th><th>Топ</th><th>Ұпай</th><th>✓</th><th>✗</th><th>Қадам</th><th>Мәре</th></tr>${r.map((x,k)=>`<tr style="background:${x.t.c}55"><td>${k+1}</td><td>${x.t.n}</td><td><b>${x.s}</b></td><td>${x.c}</td><td>${x.w}</td><td>${x.p}</td><td>${x.r?'🏡':'—'}</td></tr>`).join('')}</table></div><button class="btn" onclick="if(confirm('Жаңа ойын бастау? Бұрынғы нәтиже өшеді.'))mk()">🔄 ЖАҢА ОЙЫН</button>`;if(!final.d){final.d=1;fx(1)}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function fx(big){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cs=['#ff9eb5','#ffd75e','#8fd6f2','#ffb48a','#fff'];
 const P=[...Array(big?160:60)].map(()=>({x:Math.random()*c.width,y:big?c.height*.5:-10,vx:(Math.random()-.5)*(big?9:3),vy:big?-Math.random()*12:Math.random()*3+1,c:cs[Math.random()*5|0],r:3+Math.random()*5,s:Math.random()<.3}));let f=0;
 (function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;x.fillStyle=p.c;x.strokeStyle='#0003';x.beginPath();if(p.s){for(let k=0;k<10;k++){const a=k*Math.PI/5,r=k%2?p.r:p.r*2;x.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r)}}else x.arc(p.x,p.y,p.r,0,7);x.fill();x.stroke()});
 if(++f<(big?260:140))requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
